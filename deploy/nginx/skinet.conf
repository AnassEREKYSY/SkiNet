# Nginx site for Skinet on the OVH VM (host Nginx, TLS with Let's Encrypt).
# 1. Replace skinet.example.com with your domain (2 places), copy to /etc/nginx/sites-available/skinet
# 2. sudo ln -s /etc/nginx/sites-available/skinet /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d skinet.example.com   (adds the HTTPS server block and the redirect)

server {
  listen 80;
  server_name skinet.example.com;

  client_max_body_size 10m;

  location / {
    proxy_pass         http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # SignalR (WebSockets)
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
