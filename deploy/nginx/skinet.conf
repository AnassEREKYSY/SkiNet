# Skinet site for the VM's "reverse-proxy" container (Nginx on ports 80/443, config in /opt/nginx/conf.d).
# skinet-client is on the same "web" Docker network. Certificate: its own Let's Encrypt cert, issued with
# the webroot method (/etc/letsencrypt/acme-webroot, same as bday), so no downtime for renewals.
# Setup steps: DEPLOYMENT.md, "Domain and HTTPS".

server {
  listen 80;
  server_name skinet.anasserekysy.com;

  location ^~ /.well-known/acme-challenge/ {
    root /etc/letsencrypt/acme-webroot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name skinet.anasserekysy.com;

  ssl_certificate     /etc/letsencrypt/live/skinet.anasserekysy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skinet.anasserekysy.com/privkey.pem;

  client_max_body_size 10m;

  # Docker DNS + variable: the proxy still starts if Skinet is down or being redeployed.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $skinet http://skinet-client:80;

  location / {
    proxy_pass         $skinet;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # SignalR (WebSockets)
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
