name: CI/CD - Build, push to GHCR and deploy to OVH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skinet-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/anasserekysy/skinet-api
  CLIENT_IMAGE: ghcr.io/anasserekysy/skinet-client

jobs:
  # 1. Compile both apps on every push / PR
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build API
        run: |
          dotnet restore SkiNet.sln
          dotnet build SkiNet.sln --configuration Release --no-restore

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build client
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # 2. Build the Docker images and push them to GHCR (main only)
  images:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: API/Dockerfile
          - name: client
            context: ./client
            file: ./client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            STRIPE_PUBLISHABLE_KEY=${{ secrets.SKINET_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/anasserekysy/skinet-${{ matrix.name }}:latest
            ghcr.io/anasserekysy/skinet-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 3. Deploy the exact images of this commit on the OVH VM
  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh
          target: skinet
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SQL_PASSWORD: ${{ secrets.SKINET_SQL_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.SKINET_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.SKINET_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.SKINET_STRIPE_WEBHOOK_SECRET }}
          CLIENT_PORT: ${{ vars.SKINET_CLIENT_PORT }}
          CLIENT_BIND: ${{ vars.SKINET_CLIENT_BIND }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,SQL_PASSWORD,STRIPE_PUBLISHABLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,CLIENT_PORT,CLIENT_BIND
          command_timeout: 15m
          script: |
            chmod +x ~/skinet/deploy.sh
            ~/skinet/deploy.sh
