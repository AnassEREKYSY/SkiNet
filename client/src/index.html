<!doctype html>
<html lang="en" class="custom-theme">
<head>
  <meta charset="utf-8">
  <title>Skinet · Snow sports gear</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Boards, boots, gloves and hats for the mountain.">
  <meta name="theme-color" content="#0f2e4f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    #initial-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
    #initial-splash img { width: 48px; height: 48px; animation: skinet-pulse 1.2s ease-in-out infinite; }
    @keyframes skinet-pulse { 50% { opacity: .45; } }
  </style>
</head>
<body>
  <div id="initial-splash"><img src="/images/logo-mark.svg" alt=""></div>
  <app-root></app-root>
</body>
</html>
