<div class="flex items-center justify-between px-6 pb-2 pt-5">
  <h2 class="text-xl font-bold tracking-tight text-navy">Filters</h2>
  <button type="button" class="grid h-9 w-9 place-items-center rounded-xl text-ink-muted hover:bg-snow hover:text-navy"
          (click)="close()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="max-h-[60vh] overflow-y-auto px-6 py-2">
  <div class="grid gap-6 sm:grid-cols-2">
    <section>
      <p class="mb-2 text-sm font-semibold text-navy">Type</p>
      <ul class="space-y-0.5">
        @for (type of shopService.types; track type) {
          <li>
            <mat-checkbox class="filter-check" [checked]="selectedTypes.includes(type)"
                          (change)="toggle('types', type, $event.checked)">{{ type }}</mat-checkbox>
          </li>
        }
      </ul>
    </section>
    <section>
      <p class="mb-2 text-sm font-semibold text-navy">Brand</p>
      <ul class="space-y-0.5">
        @for (brand of shopService.brands; track brand) {
          <li>
            <mat-checkbox class="filter-check" [checked]="selectedBrands.includes(brand)"
                          (change)="toggle('brands', brand, $event.checked)">{{ brand }}</mat-checkbox>
          </li>
        }
      </ul>
    </section>
  </div>
</div>

<div class="mt-2 flex items-center justify-between gap-3 border-t border-line px-6 py-4">
  <button type="button" class="link text-sm disabled:opacity-40 disabled:no-underline"
          [disabled]="!selectedBrands.length && !selectedTypes.length" (click)="clear()">Clear all</button>
  <button mat-flat-button type="button" (click)="applyFilters()">Show results</button>
</div>
