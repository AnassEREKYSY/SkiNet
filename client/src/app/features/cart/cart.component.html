<div class="container py-10">
  @if (cartService.cart()?.items?.length) {
    <div class="mb-8">
      <h1 class="h1">Your cart</h1>
      <p class="muted mt-2">{{ cartService.itemCount() }} {{ cartService.itemCount() === 1 ? 'item' : 'items' }} ready for checkout.</p>
    </div>

    <div class="grid grid-cols-[minmax(0,1fr)] gap-8 lg:grid-cols-[minmax(0,1fr)_360px] lg:items-start">
      <section class="card divide-y divide-line px-4 sm:px-6" aria-label="Cart items">
        @for (item of cartService.cart()?.items; track item.productId) {
          <app-cart-item [item]="item"></app-cart-item>
        }
      </section>

      <aside class="lg:sticky lg:top-24">
        <app-order-summary></app-order-summary>
      </aside>
    </div>
  } @else {
    <app-empty-state
      message="Your cart is empty"
      icon="shopping_cart"
      actionText="Start shopping"
      (action)="onAction()"
    />
  }
</div>
