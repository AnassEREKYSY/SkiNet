<div class="flex gap-4 py-5 sm:items-center sm:gap-5">
  <a [routerLink]="['/shop', item().productId]" class="block h-20 w-20 shrink-0 overflow-hidden rounded-xl bg-snow sm:h-24 sm:w-24">
    <img [src]="item().pictureUrl" [alt]="item().productName" class="h-full w-full object-cover" />
  </a>

  <div class="flex min-w-0 flex-1 flex-col gap-3 sm:flex-row sm:items-center sm:gap-6">
    <div class="min-w-0 flex-1">
      <p class="text-xs font-medium uppercase tracking-wider text-ink-muted">{{ item().brand }} · {{ item().type }}</p>
      <a [routerLink]="['/shop', item().productId]" class="mt-0.5 line-clamp-2 font-semibold leading-snug text-ink hover:text-navy">
        {{ item().productName }}
      </a>
      <p class="mt-1 text-sm text-ink-muted">{{ item().price | currency }} each</p>
    </div>

    <div class="flex items-center justify-between gap-3 sm:justify-end sm:gap-6">
      <div class="stepper" role="group" [attr.aria-label]="'Quantity for ' + item().productName">
        <button type="button" (click)="decrementQuantity()" aria-label="Decrease quantity">
          <mat-icon>remove</mat-icon>
        </button>
        <span class="w-8 text-center font-semibold tabular-nums text-ink">{{ item().quantity }}</span>
        <button type="button" (click)="incrementQuantity()" aria-label="Increase quantity">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <p class="price text-right sm:w-24">{{ item().price * item().quantity | currency }}</p>

      <button type="button" class="remove-btn" (click)="removeItemFromCart()" [attr.aria-label]="'Remove ' + item().productName">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>
