<div class="container flex justify-center py-12 sm:py-16">
  <div class="w-full max-w-[420px]">
    <div class="card p-6 sm:p-8">
      <div class="text-center">
        <img src="/images/logo-mark.svg" alt="" class="mx-auto h-11 w-11" />
        <h1 class="mt-5 text-2xl font-bold tracking-tight text-navy">Welcome back</h1>
        <p class="mt-1.5 text-sm muted">Sign in to check out faster and track your orders.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-7">
        <app-text-input label="Email address" formControlName="email" type="email"
                        placeholder="name@example.com" autocomplete="email" />
        <app-text-input label="Password" formControlName="password" type="password"
                        placeholder="Your password" autocomplete="current-password" />
        <button mat-flat-button type="submit" class="mt-2 w-full">Sign in</button>
      </form>

      <div class="soft-box mt-6 p-4">
        <div class="flex items-center gap-2 text-sm font-semibold text-navy">
          <mat-icon class="!h-[18px] !w-[18px] !text-[18px] text-ice-700">info</mat-icon>
          Demo accounts
        </div>
        <p class="mt-1 text-xs muted">Fill the form with a test user, then sign in.</p>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <button type="button" class="demo-btn" (click)="fillDemo('tom@test.com')">
            <span class="font-semibold text-navy">Customer</span>
            <span class="truncate text-xs muted">tom&#64;test.com</span>
          </button>
          <button type="button" class="demo-btn" (click)="fillDemo('admin@test.com')">
            <span class="font-semibold text-navy">Admin</span>
            <span class="truncate text-xs muted">admin&#64;test.com</span>
          </button>
        </div>
      </div>
    </div>

    <p class="mt-6 text-center text-sm muted">
      New to Skinet?
      <a routerLink="/account/register" class="link">Create an account</a>
    </p>
  </div>
</div>
