<div class="p-6">
  <div class="flex items-start gap-4">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-danger/10 text-danger">
      <mat-icon>warning_amber</mat-icon>
    </span>
    <div>
      <h2 class="text-lg font-bold text-navy">{{ data.title }}</h2>
      <p class="mt-1.5 text-sm muted">{{ data.message }}</p>
    </div>
  </div>
  <div class="mt-6 flex justify-end gap-2">
    <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button type="button" class="danger-btn" (click)="onConfirm()" cdkFocusInitial>Confirm</button>
  </div>
</div>
